<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8a4b2a" />
    <meta name="description" content="ShieldUp — unofficial, local-first study app for the CEH v13 exam. Not affiliated with or endorsed by EC-Council." />
    <title>ShieldUp</title>
    <script>
      // Apply the saved theme before first paint (avoids a light flash in dark mode).
      try {
        var t = localStorage.getItem('shieldup-theme');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
