[package]
name = "shieldup"
# The app version comes from package.json (tauri.conf.json "version"); this one is not used.
version = "0.0.0"
description = "ShieldUp: unofficial, local-first study app for the CEH v13 exam"
authors = ["malacacalex"]
license = "MIT"
repository = "https://github.com/malacacalex/CEH_Revision_App"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "shieldup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
